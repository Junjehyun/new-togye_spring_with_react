# 이 파일은 라라벨의 .env 파일과 비슷한 역할을 한다. 서버가 켜질 때, 
# 읽어들이는 설정값들을 모아둔 곳이다. 자바 코드를 고치지 않고도, 
# 이 파일의 값만 바꿔서 서버의 동작 (포트 번호, DB 위치 등)을 바꿀 수 있다.

# 이 스프링부트 어플리케이션의 이름
spring.application.name=togye

# DB 관련 설정
spring.datasource.url=jdbc:mysql://localhost:3306/new_togye?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.jpa.hibernate.ddl-auto=update 이건 매우 중요한 설정이다.
# 프로젝트 내 "Entity 클래스를 보고, 그에 맞는 테이블이 DB에 없으면 새로 만들고, 
# 이미 있으면 그대로 두되 필요한 컬럼만 추가해줘" 라는 뜻이다. 
# 라라벨의 마이그레이션 파일을 직접 짜지 않고, 스프링이 Entity 코드를 보고 자동으로 
# 스키마를 맞춰주는 방식이라고 할 수 있다. 
# 다만 삭제 하는 것 까지는 자동으로 안된다. 이건 수동으로 해야한다.
spring.jpa.hibernate.ddl-auto=update
# true일 경우, 서버가 실제로 어떤 SQL문을 실행하는지 터미널 로그에 전부 찍어줌.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 직접 만든 설정 이름이다. 스프링이 기본으로 제공하는 게 아니라, WebConfig.java에서
# @Value로 이 값을 읽어서 쓰도록 직접 정의함. 
# "이 주소에서 오는 요청만 CORS를 허락해준다."는 뜻이고, 지금은 프론트엔드가 뜨는
# 5173번 포트로 맞춰뒀다.
app.cors.allowed-origin=http://localhost:5173